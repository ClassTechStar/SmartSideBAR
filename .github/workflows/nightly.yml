# Nightly —— Karpathy 裁决落地: march of nines。
# 每晚全量测试 (含 6 链路 headless 冒烟 + 截图像素基线), 连续跑一百个晚上,
# 让"只在真机上偶发"的缺陷在 CI 里先红。失败上传全部测试产物供晨间排查。
name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'  # 每日 18:00 UTC (北京时间次日 02:00)
  workflow_dispatch: {}

jobs:
  nightly:
    name: 全量测试 + 冒烟 + 像素基线
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build
        run: |
          dotnet restore SmartSideBAR.slnx
          dotnet build SmartSideBAR.slnx -c Release --no-restore
      - name: Full test suite (3 遍, 抓偶发)
        run: |
          dotnet test SmartSideBAR.slnx -c Release --no-build --logger "trx;LogFileName=run1.trx" --results-directory TestResults
          dotnet test SmartSideBAR.slnx -c Release --no-build --logger "trx;LogFileName=run2.trx" --results-directory TestResults
          dotnet test SmartSideBAR.slnx -c Release --no-build --logger "trx;LogFileName=run3.trx" --results-directory TestResults
      - name: 启动冒烟 (真实运行 5s 退出 + 退出残留断言, 方案 §4.2/§4.4)
        shell: pwsh
        run: |
          $env:SSB_SMOKE_EXIT_MS = "5000"
          $p = Start-Process "src/SmartSideBAR.Avalonia/bin/Release/net10.0-windows10.0.19041.0/SmartSideBAR.Avalonia.exe" -PassThru
          $exited = Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) {
            taskkill /F /IM SmartSideBAR.Avalonia.exe 2>$null
            throw "启动冒烟 60s 未自行退出 —— 启动路径存在致命异常"
          }
          if ($p.ExitCode -ne 0) { throw "启动冒烟退出码 $($p.ExitCode) (非 0 = 启动路径崩溃)" }
          Start-Sleep -Seconds 2
          if (Get-Process -Name SmartSideBAR.Avalonia -ErrorAction SilentlyContinue) {
            throw "退出残留: SmartSideBAR 进程仍在运行"
          }
          Write-Host "启动冒烟通过 (exit 0, 无残留进程)"

      - name: Headless 冒烟 (标记筛选, 独立跑一遍留产物)
        run: >
          dotnet test tests/SmartSideBAR.Avalonia.Tests -c Release --no-build
          --logger "trx;LogFileName=smoke.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: |
            TestResults/**
          retention-days: 30
