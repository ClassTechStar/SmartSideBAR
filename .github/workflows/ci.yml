# SmartSideBAR CI —— ADR-001 后 Avalonia 单栈:
#   1) secrets-scan : gitleaks 前置门禁 (全历史)
#   2) dotnet       : 三层构建 + 格式 + 测试 + 覆盖率门禁(≥40%) + publish artifact
#   3) perf-bench   : 每周一性能基准 (schedule 触发)
#   4) release      : v* tag → Inno 安装包 → Release 草稿
# Electron 栈已于 v1.5 后归档至 archive/electron-final 分支 (相关 job 一并移除)。
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全历史扫描
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet:
    name: Avalonia (Core/Windows/Avalonia 三层)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SmartSideBAR.slnx
      - name: Build
        run: dotnet build SmartSideBAR.slnx -c Release --no-restore
      - name: Format check
        run: dotnet format SmartSideBAR.slnx --verify-no-changes --no-restore
      - name: Test (含 headless 冒烟与像素基线)
        run: dotnet test SmartSideBAR.slnx -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Coverage gate (≥40%)
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          dotnet test SmartSideBAR.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
          # 测试项目必须引用 coverlet.collector，否则 --collect 会静默不产出报告。
          # 这里显式校验，避免 reportgenerator 读到空输入后只报一句含糊的取文件失败。
          $reports = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue
          if (-not $reports) {
            throw "没有生成 coverage.cobertura.xml —— 请确认各测试项目已引用 coverlet.collector"
          }
          Write-Host "coverage reports: $($reports.Count)"
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:cover -reporttypes:TextSummary
          if (-not (Test-Path cover/Summary.txt)) { throw "reportgenerator 未生成 cover/Summary.txt" }
          $txt = Get-Content cover/Summary.txt -Raw
          $m = [regex]::Match($txt, 'Line coverage:\s+([\d.]+)%')
          if (-not $m.Success) { throw "Summary.txt 中未找到行覆盖率" }
          $line = $m.Groups[1].Value
          Write-Host "Line coverage: $line%"
          $min = 40
          if ([double]$line -lt $min) { throw "coverage $line% < $min%" }
      - name: Publish (自包含单文件, ReadyToRun+裁剪+压缩)
        run: >
          dotnet publish src/SmartSideBAR.Avalonia -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true
          -p:TrimMode=partial -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=true
          -o artifacts/app
      - uses: actions/upload-artifact@v4
        with:
          name: app-win-x64
          path: artifacts/app

  perf-bench:
    name: Perf Bench (每周)
    if: github.event_name == 'schedule'
    needs: [dotnet]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-win-x64
          path: artifacts/app
      - name: Run bench-p28
        shell: pwsh
        run: node scripts/bench-p28.mjs --exe artifacts/app/SmartSideBAR.Avalonia.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-bench-report
          path: bench-results/**
          retention-days: 90

  release:
    name: Release (v* tag → Inno 安装包)
    needs: [dotnet]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-win-x64
          path: artifacts/app
      # 可选签名: secrets 未配置则跳过 (默认不签名发布, 见 docs/ARCHITECTURE.md 安全边界)
      - name: Sign exe (可选, secrets 注入)
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PFX_PASS }}
        if: env.PFX_B64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          signtool sign /f cert.pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            artifacts/app/SmartSideBAR.Avalonia.exe
          Remove-Item cert.pfx
      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 7\ISCC.exe" installer\SmartSideBAR.iss
      - name: Sign installer (可选)
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          PFX_PASS: ${{ secrets.CODESIGN_PFX_PASS }}
        if: env.PFX_B64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $setup = Get-ChildItem dist\*-Setup.exe | Select-Object -First 1
          signtool sign /f cert.pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
          Remove-Item cert.pfx
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*-Setup.exe
